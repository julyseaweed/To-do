<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-do</title><link rel="stylesheet" href="./todo.css?v=clear-compact-2"><script defer src="./todo.js?v=clear-compact-2"></script></head>
<body><main id="window"><header><h1>To-do</h1><div class="tools"><button id="more" aria-label="More" aria-expanded="false">···</button><button id="collapse" aria-label="Collapse list"><svg viewBox="0 0 20 20"><path d="M4 10h12"/></svg></button><button id="close" aria-label="Close panel"><svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div></header><div id="board" aria-label="Task board"></div><footer><button id="new-topic">＋ New topic</button></footer><div id="feedback" hidden><span id="status" role="status"></span><button id="undo" disabled>Undo</button></div><div id="settings" hidden><label for="transparency">Transparency <output id="transparency-value">45%</output></label><input id="transparency" type="range" min="35" max="95" value="45"></div><div class="resize nw"></div><div class="resize ne"></div><div class="resize sw"></div><div class="resize se"></div></main><div id="restore" hidden><button id="expand" aria-label="Open list"><img src="./todo-icon.png" alt=""></button><button class="bubble-close" aria-label="Close bubble">×</button></div></body></html>
